# ------------------------------
# Prefix key
# ------------------------------
set-option -g prefix C-t

# ------------------------------
# Key bindings (Ghostty-like)
# ------------------------------
# Ctrl+t → t で新規ウィンドウ
bind t new-window

# Ctrl+t → d で垂直分割（左右）
bind d split-window -h

# Ctrl+t → h で水平分割（上下）
bind h split-window -v

# Ctrl+t → w で現在のペインを削除
bind w kill-pane

# Ctrl+t → 矢印キーでペイン移動（-r で連続入力可能）
bind -r Left select-pane -L
bind -r Down select-pane -D
bind -r Up select-pane -U
bind -r Right select-pane -R

# Ctrl+t → k で画面クリア
bind k send-keys -R \; clear-history

# ------------------------------
# Settings
# ------------------------------
# マウス操作を有効化
set -g mouse on

# ステータスバーの更新間隔（秒）
set -g status-interval 1

# ------------------------------
# Status bar
# ------------------------------
# ステータスバー左側にペイン番号を表示
set -g status-left "Pane:#P | "

# ------------------------------
# Session persistence
# ------------------------------
# 保存忘れを防ぐため15分ごとに保存し、tmuxサーバー起動時に最後の保存状態を復元する。
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# ------------------------------
# Plugins (TPM)
# ------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# status-rightへ保存処理を追加するため、Continuumは最後に登録する。
set -g @plugin 'tmux-plugins/tmux-continuum'

# 全プラグインの設定を反映するため、一覧と各設定の後でTPMを初期化する。
run-shell '~/.tmux/plugins/tpm/tpm'

# 導入はセットアップから行うため、TPMが登録する追加・更新キーを初期化後に解除する。
unbind-key -T prefix I
unbind-key -T prefix U
