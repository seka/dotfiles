name: dotfiles-browserless

services:
  browserless:
    image: ghcr.io/browserless/chromium:v2.63.1
    ports:
      - "127.0.0.1:3333:3000"
    env_file:
      - "${XDG_CONFIG_HOME:-${HOME}/.config}/browserless/browserless.env"
    environment:
      CONCURRENT: "2"
      TIMEOUT: "900000"
    shm_size: "1gb"
    mem_limit: "2gb"
    cpus: 2
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e 'fetch("http://127.0.0.1:3000/pressure?token=" + process.env.TOKEN).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
